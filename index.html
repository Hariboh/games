<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tankarium</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#05080f;--ink:#d6e6f5;--dim:#6f8aa6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#hud{display:flex;gap:8px;padding:8px;justify-content:center;flex-wrap:wrap}
.p{border-left:4px solid var(--c);background:#0b1424;padding:4px 12px;min-width:140px;display:grid;grid-template-columns:1fr auto;column-gap:10px;font-size:13px}
.p b{color:var(--c);font-size:15px}.k{text-align:right;font-weight:700}
.pips{display:flex;gap:3px;align-items:center}.pips u{width:16px;height:6px;background:#1a2a44}.pips u.on{background:var(--c)}
.p em{font-style:normal;color:var(--dim);grid-column:1/3;min-height:15px;font-size:12px}
.p.rdy em{color:var(--c)}
.lg{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;align-content:center;justify-content:center;gap:4px 14px;font-size:13px;color:var(--dim)}.lg span{display:flex;align-items:center;gap:4px;white-space:nowrap}.lg .sl{color:#7dffea}.lg .sl b{background:#7dffea;clip-path:polygon(50% 0,88% 50%,50% 100%,12% 50%)}.lg .dv{width:1px;height:16px;background:#2a3a55}
.lg b{width:16px;height:16px;display:inline-grid;place-items:center;color:#05080f;font-size:11px}.p.out{opacity:.4}
#msg{position:fixed;top:32%;left:0;right:0;text-align:center;font-size:clamp(22px,4.2vw,60px);padding:0 6%;box-sizing:border-box;font-weight:700;pointer-events:none;opacity:0;transition:opacity .4s;color:#fff;text-shadow:0 0 24px #3d8bff}#msg.on{opacity:1}
.ks small{display:block;font-size:.7em;opacity:.85}
.ks{font-size:.55em;margin-top:.4em;display:flex;gap:1.4em;justify-content:center;flex-wrap:wrap;text-shadow:0 0 12px #05080f}
#end[hidden]{display:none}#ov[hidden]{display:none}
.nm{display:flex;gap:8px}#ov .opt,#ov .opt2{background:#17294a;color:var(--ink);padding:6px 16px;font-size:14px}#ov .opt.on{background:#3d8bff;color:#05080f}
#names{display:grid;grid-template-columns:repeat(2,auto);gap:8px}#names[hidden]{display:none}#rr[hidden]{display:none}
#names input{background:#0b1424;color:var(--c);border:2px solid var(--c);padding:6px 10px;font:inherit;font-weight:700;width:9.5em;outline:none}#names input:focus{box-shadow:0 0 0 2px var(--c)}
#ov p{max-width:34em;padding:0 5%;box-sizing:content-box;text-align:center;font-size:clamp(16px,2.2vw,22px);line-height:1.5}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;transition:filter .5s}canvas.slow{filter:saturate(.45) contrast(1.2) hue-rotate(-15deg)}
#tint{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle,rgba(255,40,70,.08) 30%,rgba(150,0,50,.55) 100%)}#tint.on{opacity:1}
.tip{position:fixed;left:0;right:0;bottom:calc(3% + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(14px,2vw,24px);font-weight:700;color:#d6e6f5;text-shadow:0 0 10px #05080f,0 0 3px #05080f;white-space:pre-wrap;pointer-events:none;opacity:0;transition:opacity .6s}.tip.on{opacity:1}
#wtint{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s}#wtint.on{opacity:1}
#ov,#end{position:fixed;inset:0;background:rgba(5,8,15,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;text-align:center}
#ov h1,#end h1{font-size:clamp(36px,8vw,84px);margin:0;letter-spacing:.02em}
#ov p,#end p{margin:0;color:var(--dim)}
#ov button,#end button{font:inherit;font-weight:700;background:#3d8bff;color:#05080f;border:0;padding:12px 28px;font-size:18px;cursor:pointer}
#ov button:focus-visible{outline:3px solid #fff}
</style></head><body>
<div id="hud"></div><div id="stage"><canvas id="c"></canvas></div>
<div id="tint"></div><div id="wtint"></div>
<div id="help" class="tip">Space = Pause.  M = Mute.  F = Fullscreen.  R = Restart</div><div id="rs" class="tip">R = Restart</div><div id="msg"></div><div id="end" hidden><h1></h1><p></p><p id="hm"></p><button>Play again</button></div>
<div id="ov"><h1>Tankarium</h1><p>Collect power cells to charge your Super Laser.<br>Find hidden power-ups. Destroy the arena.<br>Most kills wins. Place your bets!</p><div class="nm"><button class="opt on" data-m="1">Name Tanks</button><button class="opt" data-m="2">Random Names</button></div>
<div id="names"><input maxlength="14" placeholder="Red Tank" style="--c:#ff3b4e"><input maxlength="14" placeholder="Blue Tank" style="--c:#3d8bff"><input maxlength="14" placeholder="Yellow Tank" style="--c:#ffd23a"><input maxlength="14" placeholder="Green Tank" style="--c:#3dff8a"></div>
<button class="opt2" id="rr" hidden>Reroll names</button>
<button class="go">Start with sound</button><p>M: mute. F: fullscreen. Space: pause. R: restart</p></div>
<script>
const COLS=31,ROWS=19,PAD=[[1,1],[COLS-2,1],[1,ROWS-2],[COLS-2,ROWS-2]],D=[[1,0],[-1,0],[0,1],[0,-1]],RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),wc=document.createElement('canvas'),wx=wc.getContext('2d');
let ringOwn=new Map(),intro=true,bm=new Set(),ovt=0,slow=false,wl=99,bt=60,paused=false,fin=false,over=false,T=20,S=20,g=[],cs=new Set(),infBy=new Map(),infected=new Map(),ghosts=[],flashes=[],items=[],soldiers=[],mines=[],pu=new Map(),bullets=[],parts=[],beams=[],dirty=true,shake=0,time=0;
const rnd=(a,b)=>a+Math.random()*(b-a),wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tanks=[['Red','#ff3b4e',1.5,1.5],['Blue','#3d8bff',COLS-1.5,1.5],['Yellow','#ffd23a',1.5,ROWS-1.5],['Green','#3dff8a',COLS-1.5,ROWS-1.5]].map(([n,c,x,y])=>({n,c,c0:c,sx:x,sy:y,x,y,a:0,ta:0,kills:0,cells:0,alive:true,rs:0,cd:1,ch:0,tg:null,path:null,rp:0,inv:1,pw:null,sz:1,lt:0,lb:'',lc:'',mn:0,md:0,hold:0}));

function genMaze(){
 g=Array.from({length:ROWS},()=>Array(COLS).fill(1));const st=[[1,1]];g[1][1]=0;
 while(st.length){const[x,y]=st[st.length-1];
  const n=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const a=x+dx,b=y+dy;return a>0&&b>0&&a<COLS-1&&b<ROWS-1&&g[b][a]});
  if(!n.length){st.pop();continue}
  const[dx,dy]=n[Math.random()*n.length|0];g[y+dy/2][x+dx/2]=0;g[y+dy][x+dx]=0;st.push([x+dx,y+dy]);}
 for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++)if(g[y][x]&&Math.random()<.14)g[y][x]=0;
 PAD.forEach(([px,py])=>{g[py][px]=0});
}
function randFree(){let x,y;do{x=1+Math.random()*(COLS-2)|0;y=1+Math.random()*(ROWS-2)|0}while(g[y][x]);return[x,y]}
function addCell(){let i;do{const[x,y]=randFree();i=y*COLS+x}while(cs.has(i));cs.add(i)}
function bfs(sx,sy,goal,bad){
 const pv=new Int16Array(COLS*ROWS).fill(-2),q=[sy*COLS+sx];pv[q[0]]=-1;
 for(let i=0;i<q.length;i++){const c=q[i],x=c%COLS,y=c/COLS|0;
  if(i&&goal(x,y)){const p=[];let k=c;while(pv[k]!==-1){p.push(k);k=pv[k]}return p.reverse().map(k=>[k%COLS+.5,(k/COLS|0)+.5])}
  for(const[dx,dy]of D){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&!g[ny][nx]&&pv[ny*COLS+nx]===-2&&!(bad&&bad.has(ny*COLS+nx))){pv[ny*COLS+nx]=c;q.push(ny*COLS+nx)}}}
 return null}
function push(o,r){for(let j=(o.y|0)-1;j<=(o.y|0)+1;j++)for(let i=(o.x|0)-1;i<=(o.x|0)+1;i++){
 if(j<0||i<0||j>=ROWS||i>=COLS||!g[j][i])continue;
 const cx=clamp(o.x,i,i+1),cy=clamp(o.y,j,j+1);let dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
 if(d<r){if(d<1e-4){dx=1;dy=0;d=1}o.x+=dx/d*(r-d);o.y+=dy/d*(r-d)}}}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/.2);for(let i=1;i<n;i++){if(g[(ay+(by-ay)*i/n)|0][(ax+(bx-ax)*i/n)|0])return false}return true}

/* ---------- audio ---------- */
let AC,mg,mus,sfxb,nb,muted=false,step=0,nextT=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=AC.createGain();mg.gain.value=.8;mg.connect(AC.destination);
 mus=AC.createGain();mus.gain.value=.3;mus.connect(mg);sfxb=AC.createGain();sfxb.gain.value=.75;sfxb.connect(mg);
 nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 nextT=AC.currentTime+.1;setInterval(sched,30)}
function tone(type,f0,f1,d,v,w=0,dst=sfxb,lp){if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+w;
 o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+d);
 gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);let n=o;
 if(lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f}
 n.connect(gn);gn.connect(dst);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fq,w=0,dst=sfxb,type='lowpass'){if(!AC)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain(),t=AC.currentTime+w;
 s.buffer=nb;f.type=type;f.frequency.value=fq;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
 s.connect(f);f.connect(gn);gn.connect(dst);s.start(t);s.stop(t+d)}
const CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],BR=[33,29,36,31];
function sched(){while(nextT<AC.currentTime+.15){(fin?playF:play)(step,nextT-AC.currentTime);nextT+=60/(fin?72:118)/4;step++}}
function play(s,w){const b=(s>>4)&3,i=s&15,ch=CH[b];
 if(i%4===0)tone('sine',150,40,.2,.9,w,mus);
 if(i===4||i===12)noise(.15,.5,1800,w,mus,'bandpass');
 if(i%2===1)noise(.035,.18,7500,w,mus,'highpass');
 if([0,3,6,8,11,14].includes(i))tone('sawtooth',mf(BR[b]),0,.2,.4,w,mus,450+((s>>4)%2)*250);
 tone('square',mf(ch[[0,1,2,1][i&3]]+(i>=8?24:12)),0,.11,.1,w,mus,2400);
 if(i===0&&(s>>4)%8===7)tone('triangle',mf(81),mf(69),.6,.15,w,mus)}
const CF=[[57,60,64],[53,57,60],[50,53,57],[52,56,59]],BF=[33,29,26,28];
function playF(s,w){const b=(s>>4)&3,i=s&15,ch=CF[b];
 if(i===0){ch.forEach(n=>tone('sawtooth',mf(n),0,2.8,.07,w,mus,900));tone('sawtooth',mf(BF[b]),0,3,.3,w,mus,350);tone('sine',mf(BF[b]-12),0,3,.4,w,mus)}
 if(i===0||i===8)tone('sine',110,35,.6,1,w,mus);
 if(i===8)noise(.6,.25,300,w,mus);
 if(i%4===2)tone('triangle',mf(ch[(i>>2)%3]+24),0,.9,.1,w,mus,2000)}
const sfx={
 shot(){tone('square',900,200,.14,.22);noise(.06,.2,4000)},
 boom(){noise(.7,.9,900);tone('sine',120,30,.5,.8)},
 pick(){tone('sine',700,1400,.1,.22);tone('sine',1000,2000,.1,.2,.07)},
 charge(){tone('sawtooth',100,1100,1,.18,0,sfxb,1500)},
 laser(){noise(1,.8,5000);tone('sawtooth',1400,60,.9,.45);tone('square',60,35,.9,.6)},
 wall(){noise(.4,.5,1200)},
 spawn(){tone('triangle',300,900,.3,.2)},
 final(){tone('sawtooth',80,500,1.4,.4);noise(1,.5,600)},
 win(){[0,4,7,12,16].forEach((n,i)=>tone('square',mf(72+n),0,.4,.2,i*.12))}};

/* ---------- game ---------- */
function boom(x,y,c,n=40){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(1,6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.4,1),m:1,c:i%3?c:'#fff',s:rnd(.06,.14)})}}
function debris(x,y){for(let i=0;i<10;i++){const a=rnd(0,6.28),s=rnd(1,4);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.4,.9),m:.9,c:'#5aa7d8',s:rnd(.05,.1)})}}
const PW={speed:['SPEED UP','#ffe14a','⏩'],bomb:['DESTROYER','#ff7a2a','💥'],pingpong:['PING PONG','#5ef2ff','🏓'],ghost:['GHOST','#c9b6ff','👻'],jugg:['JUGGERNAUT','#ff5a8a','🚛'],troops:['TROOPS','#ffb86b','💂'],mines:['MINEFIELD','#ff4d4d','🧨'],possess:['POSSESS','#e06bff','👬'],bump:['BUMP','#d0d8e8','🥊'],virus:['VIRUS','#7cff3a','🦠'],freeze:['FREEZE','#bdf6ff','🧊'],hide:['HIDE','#9aa5b8','🥷']};
function eject(t){if(!g[t.y|0]||!g[t.y|0][t.x|0])return;let b=null,bd=1e9;for(let j=1;j<ROWS-1;j++)for(let i=1;i<COLS-1;i++)if(!g[j][i]){const d=Math.hypot(i+.5-t.x,j+.5-t.y);if(d<bd){bd=d;b=[i+.5,j+.5]}}if(b){t.x=b[0];t.y=b[1]}}
function bumpGroup(i,j,di,dj,dry){
 const grp=[],seen=new Set([j*COLS+i]),q=[[i,j]],ok=(a,b)=>a>0&&b>0&&a<COLS-1&&b<ROWS-1;
 for(let n=0;n<q.length&&grp.length<20;n++){const[x,y]=q[n];grp.push([x,y]);for(const[dx,dy]of D){const a=x+dx,b=y+dy,k=b*COLS+a;if(ok(a,b)&&g[b][a]&&!seen.has(k)){seen.add(k);q.push([a,b])}}}
 const inG=new Set(grp.map(([x,y])=>y*COLS+x));
 for(const[x,y]of grp){const a=x+di,b=y+dj;
  if(!ok(a,b)||(g[b][a]&&!inG.has(b*COLS+a))||PAD.some(([px,py])=>px===a&&py===b))return false;
  if(tanks.some(o=>o.alive&&o.pw!=='ghost'&&Math.abs(o.x-(a+.5))<.8&&Math.abs(o.y-(b+.5))<.8))return false}
 if(dry)return true;
 const tags=grp.map(([x,y])=>pu.get(y*COLS+x));
 grp.forEach(([x,y])=>{g[y][x]=0;pu.delete(y*COLS+x)});
 grp.forEach(([x,y],n)=>{const a=x+di,b=y+dj;g[b][a]=1;if(tags[n])pu.set(b*COLS+a,tags[n])});
 dirty=true;sfx.wall();shake=Math.max(shake,.15);return grp.length}
const quad=o=>(o.x>=COLS/2?1:0)+(o.y>=ROWS/2?2:0);
function startHide(t){let bu=0,bd=1e9;for(let u=0;u<96;u+=.5){const[px,py]=ringPos(u),d=Math.hypot(px-t.x,py-t.y);if(d<bd){bd=d;bu=u}}t.hd=true;t.hu=bu;t.ht=0;t.path=null;{const[sx,sy]=ringPos(bu);t.hst=(sy|0)*COLS+(sx|0);t.tr=new Set([t.hst]);t.trf=0}boom(t.x,t.y,'#9aa5b8',20)}
function ringPos(u){u=((u%96)+96)%96;if(u<30)return[.5+u,.5];u-=30;if(u<18)return[COLS-.5,.5+u];u-=18;if(u<30)return[COLS-.5-u,ROWS-.5];u-=30;return[.5,ROWS-.5-u]}
function eye(t){return t.hd?[clamp(t.x,1.2,COLS-1.2),clamp(t.y,1.2,ROWS-1.2)]:[t.x,t.y]}
function inward(t){let b=null,bd=1e9;for(let j=1;j<ROWS-1;j++)for(let i=1;i<COLS-1;i++)if(!g[j][i]){const d=Math.hypot(i+.5-t.x,j+.5-t.y);if(d<bd){bd=d;b=[i+.5,j+.5]}}if(b){t.x=b[0];t.y=b[1]}}
function infArea(){const seen=new Set(),q=[...infected.keys()];q.forEach(k=>seen.add(k));
 for(let n=0;n<q.length;n++){const k=q[n],x=k%COLS,y=k/COLS|0;for(const[dx,dy]of D){const a=x+dx,b=y+dy,nk=b*COLS+a;if(a>0&&b>0&&a<COLS-1&&b<ROWS-1&&g[b][a]&&!seen.has(nk)){seen.add(nk);q.push(nk)}}}return seen}
function addItem(x,y,t,bn){const taken=new Set(items.map(it=>(it.y|0)*COLS+(it.x|0)));let bx=x|0,by=y|0;
 if(taken.has(by*COLS+bx)||g[by][bx]){let bd=1e9,b=null;for(let j=1;j<ROWS-1;j++)for(let i=1;i<COLS-1;i++)if(!g[j][i]&&!taken.has(j*COLS+i)){const d=Math.hypot(i-bx,j-by);if(d<bd){bd=d;b=[i,j]}}if(!b)return;bx=b[0];by=b[1]}
 items.push({x:bx+.5,y:by+.5,t,bn})}
function freezeT(t){t.fz=30;t.ch=0;boom(t.x,t.y,'#bdf6ff',24);tone('triangle',1800,600,.3,.2)}
function ally(a,b){return a===b||a.pos===b||b.pos===a||(a.pos&&a.pos===b.pos)}
function fireB(t,a){if(t.pw==='freeze')noise(.3,.3,5000,0,sfxb,'highpass');const[ex,ey]=eye(t);bullets.push({x:ex+Math.cos(a)*.5*t.sz,y:ey+Math.sin(a)*.5*t.sz,vx:Math.cos(a)*(t.pw==='freeze'?6.5:10),vy:Math.sin(a)*(t.pw==='freeze'?6.5:10),l:t.pw==='pingpong'?6:t.pw==='freeze'?1.3:2,o:t,c:t.pw==='freeze'?'#bdf6ff':t.c,fz:t.pw==='freeze',sz:t.pw==='freeze'?3:1,pp:t.pw==='pingpong',n:0})}
function reHide(p){const w=[];for(let j=1;j<ROWS-1;j++)for(let i=1;i<COLS-1;i++)if(g[j][i]&&!pu.has(j*COLS+i))w.push(j*COLS+i);if(w.length)pu.set(w[Math.random()*w.length|0],p)}
function assignPU(){pu.clear();const ks=Object.keys(PW),w=[];for(let j=1;j<ROWS-1;j++)for(let i=1;i<COLS-1;i++)if(g[j][i])w.push(j*COLS+i);
 for(let n=0;n<ks.length*2&&w.length;n++){const k=w.splice(Math.random()*w.length|0,1)[0];pu.set(k,ks[n>>1])}}
function breakWall(i,j,q,by){if(i<1||j<1||i>=COLS-1||j>=ROWS-1||!g[j][i])return;g[j][i]=0;if(by)(by.pos||by).bd=((by.pos||by).bd||0)+1;dirty=true;if(!q)debris(i+.5,j+.5);const k=j*COLS+i;if(pu.has(k)){addItem(i,j,pu.get(k));pu.delete(k)}}
function give(t,p){t.pw=p;t.bm=0;t.lb=PW[p][0];t.lc=PW[p][1];t.lt=1.8;t.sz=1;t.hold=0;t.mn=0;t.md=0;sfx.pick();
 
 if(p==='troops'){const have=soldiers.filter(q=>q.o===t).length;for(let n=have;n<4;n++)soldiers.push({o:t,x:t.x,y:t.y,cd:rnd(.3,1),a:n*1.57})}
 t.vs=false;t.ax=undefined;t.at=time;if(p==='ghost')t.gt=30;if(p==='mines')t.mn=4;if(p==='bomb')bomb(t);
 
 if(p==='possess'){ghosts.push({o:t,x:t.x,y:t.y,l:8,a:t.a});t.pw=null}}
function bomb(t){const ti=Math.round(t.x)-2,tj=Math.round(t.y)-2,near=(x,y)=>x>=ti&&x<ti+4&&y>=tj&&y<tj+4;
